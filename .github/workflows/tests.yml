# Tests de Mes comptes à chaque envoi (e-mail de GitHub en cas d'échec).
name: tests
# Audit des robots du 10/10/2026 : pas de tests pour un envoi qui ne change que des notes (.md) ; un nouvel envoi annule le précédent.
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock jsdom
      - run: node tools/test_site.mjs
