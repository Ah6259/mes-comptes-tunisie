# Tests de Mes comptes à chaque envoi (e-mail de GitHub en cas d'échec).
name: tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock jsdom
      - run: node tools/test_site.mjs
